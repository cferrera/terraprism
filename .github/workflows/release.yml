name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          BINARY_NAME=terraprism-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -ldflags "-s -w -X main.version=${VERSION}" -o ${BINARY_NAME} ./cmd/terraprism
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraprism-${{ matrix.goos }}-${{ matrix.goarch }}
          path: terraprism-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum terraprism-* > checksums.txt

      - name: Prepare release body
        id: body
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
            RANGE_DESC="Initial release"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            RANGE_DESC="Changes since ${PREV_TAG}"
          fi

          COMMITS=$(git log "$RANGE" --format='- %s (%h)' --no-merges || true)

          {
            echo "## terraprism ${CURRENT_TAG}"
            echo
            echo "### ${RANGE_DESC}"
            echo
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "No changes in this release."
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "go install github.com/CaptShanks/terraprism/cmd/terraprism@${CURRENT_TAG}"
            echo '```'
            echo
            echo "Or download the appropriate binary below and place it in your PATH."
          } > release-body.md

          echo "path=release-body.md" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/terraprism-*
            artifacts/checksums.txt
          body_path: ${{ steps.body.outputs.path }}
          generate_release_notes: false

